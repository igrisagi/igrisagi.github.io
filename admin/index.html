<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin - ErenLabs</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --fg: #1c1b19; --bg: #faf9f6; --muted: #8a8781; --soft: #55534e; --rule: #e3e1dc; --rule2: #efeeea; --accent: #7a2e1d; }
:root[data-theme="dark"] { --fg: #e6e4de; --bg: #121211; --muted: #8f8b83; --soft: #b0ada6; --rule: #2b2a27; --rule2: #201f1d; --accent: #d98b6f; }
body { font-family: Georgia, 'Times New Roman', serif; color: var(--fg); background: var(--bg); line-height: 1.7; }
.page { max-width: 720px; margin: 0 auto; padding: 40px 24px 100px; }
h1 { font-size: 1.3rem; font-weight: normal; margin-bottom: 6px; }
h2 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 26px 0 12px; }
a, button.linklike { color: var(--fg); text-decoration: underline; text-decoration-color: var(--soft); text-underline-offset: 3px; background: none; border: 0; font: inherit; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--rule); margin: 22px 0 18px; font-family: -apple-system, sans-serif; font-size: 0.82rem; }
.tabs button { padding: 6px 0; color: var(--muted); background: none; border: 0; cursor: pointer; font: inherit; text-decoration: none; }
.tabs button.on { color: var(--fg); text-decoration: underline; text-underline-offset: 6px; }
.item { border-top: 1px solid var(--rule2); padding: 12px 0; font-size: 0.92rem; }
.item .meta { font-family: -apple-system, sans-serif; font-size: 0.75rem; color: var(--muted); margin-bottom: 3px; }
.item .ops { margin-top: 6px; font-size: 0.78rem; display: flex; gap: 14px; flex-wrap: wrap; }
.field { width: 100%; margin-bottom: 10px; padding: 8px 10px; font-family: Georgia, serif; font-size: 0.95rem; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: 3px; }
.field:focus { outline: none; border-color: var(--accent); }
textarea.field { resize: vertical; min-height: 70px; }
label { display: block; font-family: -apple-system, sans-serif; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
button.action { font-family: -apple-system, sans-serif; font-size: 0.82rem; color: var(--soft); background: none; border: 1px solid var(--rule); border-radius: 3px; padding: 6px 14px; cursor: pointer; }
button.action:hover { color: var(--fg); border-color: var(--accent); }
.status { font-family: -apple-system, sans-serif; font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
.status.err { color: var(--accent); }
.small { font-size: 0.85rem; color: var(--muted); }
.searchrow { display: flex; gap: 10px; align-items: baseline; margin-bottom: 14px; }
.searchrow input { flex: 1; margin-bottom: 0; }
.secret { font-family: ui-monospace, monospace; font-size: 0.85rem; border: 1px solid var(--rule); padding: 8px 10px; word-break: break-all; margin: 8px 0; }
</style>
</head>
<body>
<main class="page">
<h1>ErenLabs admin</h1>
<div id="root"><p class="status">Loading...</p></div>
<p class="small" style="margin-top:30px"><a href="/">Back to site</a></p>
</main>
<script src="/admin/qrcode.js?v=2" defer></script>
<script src="/admin/admin.js?v=2" defer></script>
</body>
</html>
