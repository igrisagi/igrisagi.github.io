<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ErenLabs</title>
<meta name="description" content="ErenLabs is a research company currently running experiments to achieve AGI.">
<link rel="canonical" href="https://erenlabs.me/">
<meta property="og:title" content="ErenLabs">
<meta property="og:description" content="ErenLabs is a research company currently running experiments to achieve AGI.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://erenlabs.me/">
<meta name="twitter:card" content="summary">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --fg: #1c1b19; --bg: #faf9f6; --muted: #8a8781; --soft: #55534e;
  --rule: #e3e1dc; --rule2: #efeeea; --accent: #7a2e1d; --panel: #ffffff;
}
:root[data-theme="dark"] {
  --fg: #e6e4de; --bg: #121211; --muted: #8f8b83; --soft: #b0ada6;
  --rule: #2b2a27; --rule2: #201f1d; --accent: #d98b6f; --panel: #1a1918;
}
body { font-family: Georgia, 'Times New Roman', serif; color: var(--fg); background: var(--bg); line-height: 1.7; -webkit-font-smoothing: antialiased; min-height: 100vh; }
::selection { background: var(--accent); color: var(--bg); }
a, button.linklike { color: var(--fg); text-decoration: underline; text-decoration-color: var(--soft); text-underline-offset: 3px; background: none; border: 0; font: inherit; cursor: pointer; padding: 0; }
a:hover, button.linklike:hover { color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; padding: 20px 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.82rem; }
.wordmark { font-family: Georgia, 'Times New Roman', serif; font-size: 1rem; letter-spacing: 0.02em; color: var(--fg); }
.top .controls { display: flex; gap: 18px; align-items: baseline; }
.top .controls button, .top .controls a { font-family: inherit; font-size: 0.82rem; color: var(--soft); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
.top .controls button:hover, .top .controls a:hover { color: var(--fg); text-decoration: underline; }
.account { position: relative; }
.accountmenu { position: absolute; right: 0; top: 26px; background: var(--panel); border: 1px solid var(--rule); padding: 12px 16px; min-width: 200px; text-align: left; z-index: 30; }
.accountmenu .who { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
.accountmenu button, .accountmenu a { display: block; margin: 6px 0; font-size: 0.82rem; color: var(--soft); text-decoration: none; }
.accountmenu button:hover, .accountmenu a:hover { color: var(--fg); }
.page { max-width: 620px; margin: 0 auto; padding: 26vh 24px 140px; }
.statement { font-size: 1.45rem; line-height: 1.5; margin-bottom: 28px; }
.entry { margin-top: 6px; }
.entry button.linklike { font-size: 1.05rem; }
.panel { border-top: 1px solid var(--rule); margin-top: 28px; padding-top: 20px; font-size: 0.95rem; }
.panel h2 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 14px; }
.field { width: 100%; margin-bottom: 10px; padding: 8px 10px; font-family: Georgia, 'Times New Roman', serif; font-size: 0.95rem; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: 3px; }
.field:focus { outline: none; border-color: var(--accent); }
textarea.field { resize: vertical; min-height: 70px; }
label { display: block; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
button.action { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.82rem; color: var(--soft); background: none; border: 1px solid var(--rule); border-radius: 3px; padding: 6px 14px; cursor: pointer; }
button.action:hover { color: var(--fg); border-color: var(--accent); }
button.action[disabled] { opacity: 0.5; cursor: default; }
.status { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
.status.err { color: var(--accent); }
.small { font-size: 0.85rem; color: var(--muted); }
.switcher { margin-bottom: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.82rem; }
.comment { border-top: 1px solid var(--rule2); padding: 10px 0; }
.comment .meta { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.78rem; color: var(--muted); margin-bottom: 2px; }
.comment .ops button { font-size: 0.75rem; margin-right: 12px; }
.msgfab { position: fixed; right: 20px; bottom: 20px; z-index: 20; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.82rem; color: var(--soft); background: var(--bg); border: 1px solid var(--rule); border-radius: 3px; padding: 8px 14px; cursor: pointer; }
.msgfab:hover { color: var(--fg); border-color: var(--accent); }
.msgpanel { position: fixed; right: 20px; bottom: 66px; width: min(340px, calc(100vw - 40px)); max-height: min(480px, 70vh); overflow-y: auto; background: var(--panel); border: 1px solid var(--rule); padding: 16px; z-index: 21; font-size: 0.9rem; }
.msgpanel .msg { border-top: 1px solid var(--rule2); padding: 8px 0; }
.msgpanel .msg .meta { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.75rem; color: var(--muted); }
footer { position: fixed; left: 24px; bottom: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.75rem; color: var(--muted); display: flex; gap: 16px; }
footer a { color: var(--muted); text-decoration: none; }
footer a:hover { color: var(--fg); text-decoration: underline; }
@media (max-width: 480px) {
  .page { padding-top: 20vh; }
  .statement { font-size: 1.25rem; }
  .msgpanel { right: 12px; bottom: 60px; }
  footer { left: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="top">
  <div class="wordmark">ErenLabs</div>
  <div class="controls">
    <span id="accountarea"><button type="button" id="signinbtn">Sign in</button></span>
    <button type="button" id="theme" aria-label="Switch light or dark theme">Light</button>
  </div>
</div>

<main class="page">
  <p class="statement">ErenLabs is a research company currently running experiments to achieve AGI.</p>

  <p class="entry"><button type="button" class="linklike" id="commentstoggle" aria-expanded="false">Discussion &rsaquo;</button></p>

  <section class="panel" id="commentspanel" hidden aria-label="Discussion">
    <h2>Discussion</h2>
    <div id="commentslist"><p class="status">Loading...</p></div>
    <p id="commentsmore" hidden><button type="button" class="linklike" id="loadmore">Load earlier &rsaquo;</button></p>
    <div id="commentform" style="margin-top:16px"></div>
  </section>

  <section class="panel" id="authpanel" hidden aria-label="Account">
    <h2 id="authtitle">Sign in</h2>
    <div id="authbody"></div>
  </section>
</main>

<button type="button" class="msgfab" id="msgfab">Message</button>
<section class="msgpanel" id="msgpanel" hidden aria-label="Private message to ErenLabs"></section>

<footer>
  <span>&copy; 2026 ErenLabs</span>
  <a href="/privacy">Privacy</a>
  <span id="views"></span>
</footer>
<script src="/app.js" defer></script>
</body>
</html>
